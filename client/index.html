<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a855f7" />
    <title>Peek Moment — Safe Random Video Chat with Strangers</title>
    <meta name="description" content="Meet strangers from around the world in a safe, moderated video chat. No profiles, no history. Chat, play games, share moments — or just say hi." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://peekmoment.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peek Moment — Meet Strangers, Make Memories" />
    <meta property="og:description" content="Safe random video chat with real people worldwide. No profiles, no history." />
    <meta property="og:image" content="https://peekmoment.com/peek-logo-256.webp" />
    <meta property="og:url" content="https://peekmoment.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peek Moment — Meet Strangers, Make Memories" />
    <meta name="twitter:description" content="Safe random video chat with real people worldwide." />
    <meta name="twitter:image" content="https://peekmoment.com/peek-logo-256.webp" />

    <link rel="icon" href="/peek-logo-60.webp" type="image/webp" />

    <link rel="preload" href="/fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/peek-logo-60.webp" type="image/webp" fetchpriority="high" />

    <style>
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/fredoka-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/poppins-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/poppins-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/poppins-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/poppins-700.woff2') format('woff2');
      }

      /* CRITICAL CSS — inline, paints instantly */
      html, body { margin: 0; padding: 0; background: #fdfaff; }
      body { font-family: 'Poppins', system-ui, sans-serif; }
      h1, h2, h3, h4, .peek-heading { font-family: 'Fredoka', system-ui, sans-serif; }

      .boot-nav {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 6vw;
        gap: 20px;
      }
      .boot-nav img {
        height: 64px;
        width: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static nav — paints instantly as LCP, React replaces on mount -->
      <nav class="boot-nav" aria-hidden="true">
        <img
          src="/peek-logo-128.webp"
          alt="Peek Moment"
          width="64"
          height="64"
          fetchpriority="high"
          decoding="sync"
          srcset="/peek-logo-60.webp 1x, /peek-logo-128.webp 2x"
        />
      </nav>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
