<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a855f7" />
    <title>Peek Moment — Safe Random Video Chat with Strangers</title>
    <meta name="description" content="Meet strangers from around the world in a safe, moderated video chat. No profiles, no history. Chat, play games, share moments — or just say hi." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://peekmoment.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peek Moment — Meet Strangers, Make Memories" />
    <meta property="og:description" content="Safe random video chat with real people worldwide. No profiles, no history." />
    <meta property="og:image" content="https://peekmoment.com/peek-logo-256.webp" />
    <meta property="og:url" content="https://peekmoment.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peek Moment — Meet Strangers, Make Memories" />
    <meta name="twitter:description" content="Safe random video chat with real people worldwide." />
    <meta name="twitter:image" content="https://peekmoment.com/peek-logo-256.webp" />

    <link rel="icon" href="/peek-logo-60.webp" type="image/webp" />

    <link rel="preload" href="/fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/peek-logo-60.webp" type="image/webp" fetchpriority="high" />

    <style>
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/fredoka-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/poppins-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/poppins-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/poppins-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/poppins-700.woff2') format('woff2');
      }
      html, body {
        font-family: 'Poppins', system-ui, sans-serif;
        margin: 0;
        padding: 0;
      }
      h1, h2, h3, h4, .peek-heading {
        font-family: 'Fredoka', system-ui, sans-serif;
      }

      /* Boot splash — renders instantly, before React loads */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(1200px 800px at 20% 0%, #fff1f9 0%, transparent 60%),
                    radial-gradient(1000px 700px at 90% 20%, #eef4ff 0%, transparent 55%),
                    #fdfaff;
        z-index: 9999;
      }
      .boot-splash img {
        width: 120px;
        height: 120px;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(168, 85, 247, 0.15);
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: bootSpin 0.8s linear infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img
          src="/peek-logo-128.webp"
          alt="Peek Moment"
          width="120"
          height="120"
          fetchpriority="high"
          decoding="sync"
        />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
